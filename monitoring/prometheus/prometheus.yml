# Prometheus for Hochciv (docs/operations/monitoring.md): the game server's figures
# (utils/metrics.js) and the database's (postgres-exporter), every 15 seconds.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: hochciv
    static_configs:
      - targets: ['hochciv-app:9464']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
