# Local development: builds the image from this folder and mounts the server code, so
# changes only need a container restart (docker compose -f docker-compose.local.yml restart hochciv-local).
# Optional SMTP settings go into secrets.env (gitignored). See README.md.

services:
  hochciv-db:
    image: postgres:15-alpine
    container_name: hochciv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hochciv
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: hochciv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hochciv -d hochciv"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Only reachable from this machine (for DB tools / psql)
      - "127.0.0.1:5432:5432"

  hochciv-db-setup:
    # One-shot at every `docker compose up`: creates the database roles the server uses
    # (hochciv_owner for migrations, hochciv_app for everything else) and hands the tables to the
    # owner (scripts/db-setup.js). Runs as the database superuser, whose password the server no
    # longer gets.
    build: .
    image: hochciv-multiplayer-local
    container_name: hochciv-db-setup
    restart: "no"
    entrypoint: ["node", "scripts/db-setup.js"]
    depends_on:
      hochciv-db:
        condition: service_healthy
    environment:
      - DB_HOST=hochciv-db
      - POSTGRES_USER=hochciv
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=hochciv
      - POSTGRES_OWNER_PASSWORD=owner123
      - POSTGRES_APP_PASSWORD=app123
    volumes:
      - ./scripts:/app/scripts
      - ./utils:/app/utils

  hochciv-local:
    build: .
    image: hochciv-multiplayer-local
    container_name: hochciv-multiplayer-local
    restart: unless-stopped
    depends_on:
      hochciv-db-setup:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # No NODE_ENV=production: mails are printed to the log, cookies work over http
      # BASE_URL comes from secrets.env (e.g. a tunnel URL for the Discord Activity); without it
      # the server uses http://localhost:3000. Values set here would override secrets.env.
      # The same database roles as in production (scripts/db-setup.js): the server only reads and
      # writes rows; the migrations run as the owner before it starts. Superuser: hochciv/password123
      - DATABASE_URL=postgres://hochciv_app:app123@hochciv-db:5432/hochciv
      - MIGRATION_DATABASE_URL=postgres://hochciv_owner:owner123@hochciv-db:5432/hochciv
      # Turn timer tests: TURN_TIMER_SCALE=0.05 docker compose -f docker-compose.local.yml up -d
      # makes a 60-second turn last 3 seconds (tests/timer/turn-timer.test.js)
      - TURN_TIMER_SCALE=${TURN_TIMER_SCALE:-1}
      # … and TURN_TIMER_AFK_AFTER=2 lets the KI keep a seat after two missed turns (default 3)
      - TURN_TIMER_AFK_AFTER=${TURN_TIMER_AFK_AFTER:-3}
      # Matchmaking tests (tests/match/match.test.js): groups of 2-3 form after this wait, confirm within this time
      - MATCH_GROUP_WAIT_MS=${MATCH_GROUP_WAIT_MS:-20000}
      - MATCH_CONFIRM_MS=${MATCH_CONFIRM_MS:-20000}
      # Rundenspiel timeouts, scaled down for tests/deadline (empty = the real 7 / 5 days, 10 min sweep)
      - ASYNC_TIMEOUT_MS=${ASYNC_TIMEOUT_MS:-}
      - ASYNC_REMINDER_MS=${ASYNC_REMINDER_MS:-}
      - ASYNC_SWEEP_MS=${ASYNC_SWEEP_MS:-}
      # Chat word filter tests (tests/filter/filter.test.js): the first writing timeout (default 5 minutes)
      - CHAT_MUTE_MS=${CHAT_MUTE_MS:-300000}
      # No popup for the terms of use in the browser tests, except tests/terms (TERMS_CHECK=on)
      - TERMS_CHECK=${TERMS_CHECK:-off}
    env_file:
      - path: secrets.env
        required: false
    volumes:
      - ./client:/app/client
      - ./mp.js:/app/mp.js
      - ./server.js:/app/server.js
      - ./sessions.js:/app/sessions.js
      - ./sockets:/app/sockets
      - ./routes:/app/routes
      - ./models:/app/models
      - ./utils:/app/utils
      - ./async:/app/async
      - ./maps:/app/maps
      # the game itself (rebuilt into public/ at every start)
      - ./HochCiv:/app/HochCiv
      - ./HochCiv-v108:/app/HochCiv-v108
      - ./HochCiv-v107:/app/HochCiv-v107
      - ./HochCiv-v106:/app/HochCiv-v106
      - ./HochCiv-v100:/app/HochCiv-v100
      - ./HochCiv-v98:/app/HochCiv-v98
      - ./scripts:/app/scripts
      - ./migrations:/app/migrations
      - ./config.js:/app/config.js
      - ./engine-adapter.js:/app/engine-adapter.js
      - ./elevate.js:/app/elevate.js
      - ./inject.js:/app/inject.js
      # The Discord Activity bundle is built into the image – changes to activity/bridge.js need --build
      - ./activity:/app/activity

volumes:
  pgdata:
