# Local development: builds the image from this folder and mounts the server code, so
# changes only need a container restart (docker compose -f docker-compose.local.yml restart hochciv-local).
# Optional SMTP settings go into secrets.env (gitignored). See README.md.

services:
  hochciv-db:
    image: postgres:15-alpine
    container_name: hochciv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hochciv
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: hochciv
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Only reachable from this machine (for DB tools / psql)
      - "127.0.0.1:5432:5432"

  hochciv-local:
    build: .
    container_name: hochciv-multiplayer-local
    restart: unless-stopped
    depends_on:
      - hochciv-db
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # No NODE_ENV=production: mails are printed to the log, cookies work over http
      # BASE_URL comes from secrets.env (e.g. a tunnel URL for the Discord Activity); without it
      # the server uses http://localhost:3000. Values set here would override secrets.env.
      - DATABASE_URL=postgres://hochciv:password123@hochciv-db:5432/hochciv
    env_file:
      - path: secrets.env
        required: false
    volumes:
      - ./client:/app/client
      - ./mp.js:/app/mp.js
      - ./server.js:/app/server.js
      - ./sessions.js:/app/sessions.js
      - ./sockets:/app/sockets
      - ./routes:/app/routes
      - ./models:/app/models
      - ./utils:/app/utils
      - ./async:/app/async
      - ./maps:/app/maps
      # the game itself (rebuilt into public/ at every start)
      - ./HochCiv:/app/HochCiv
      - ./HochCiv-v87:/app/HochCiv-v87
      - ./HochCiv-v83:/app/HochCiv-v83
      - ./scripts:/app/scripts
      - ./config.js:/app/config.js
      - ./engine-adapter.js:/app/engine-adapter.js
      - ./elevate.js:/app/elevate.js
      - ./inject.js:/app/inject.js
      # The Discord Activity bundle is built into the image – changes to activity/bridge.js need --build
      - ./activity:/app/activity

volumes:
  pgdata:
