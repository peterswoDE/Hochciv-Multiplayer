# Staging setup ("semi-live"), runs next to production on the same server.
# Runs the image built from the development branch (tag "staging"); Watchtower
# pulls every new staging image and restarts the server. Own database, own
# container names – production is not touched. Settings come from the .env file
# next to this file (copy .env.template to .env and fill it in). See README.md.

name: hochciv-staging

services:
  hochciv-staging-db:
    image: postgres:15-alpine
    container_name: hochciv-staging-db
    # pg_stat_statements: the slowest queries for the dashboards (needs a restart of the database)
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hochciv}
      # The superuser – only for the database itself, backups and hochciv-staging-db-setup. Only used
      # when the database volume is created for the first time.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hochciv}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # A named volume, or a folder next to this file (POSTGRES_DATA=./data/postgres in .env);
      # see docs/operations/deployment.md#data-next-to-the-compose-file
      - ${POSTGRES_DATA:-pgdata}:/var/lib/postgresql/data
    networks:
      - internal

  hochciv-staging-db-setup:
    # One-shot at every `docker compose up`: creates the database roles the server uses
    # (hochciv_owner for migrations, hochciv_app for everything else) and hands the tables to the
    # owner (scripts/db-setup.js). Runs as the database superuser, whose password the server no
    # longer gets.
    image: peterswode/hochciv-multiplayer:staging
    container_name: hochciv-staging-db-setup
    restart: "no"
    entrypoint: ["node", "scripts/db-setup.js"]
    depends_on:
      hochciv-staging-db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - DB_HOST=hochciv-staging-db
      - POSTGRES_USER=${POSTGRES_USER:-hochciv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-hochciv}
      - POSTGRES_OWNER_PASSWORD=${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD in .env}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    networks:
      - internal

  hochciv-staging:
    image: peterswode/hochciv-multiplayer:staging
    container_name: hochciv-multiplayer-staging
    restart: unless-stopped
    depends_on:
      hochciv-staging-db-setup:
        condition: service_completed_successfully
      monitoring-setup:
        condition: service_completed_successfully
    # The server needs no Linux capabilities and no privilege changes; limits keep a runaway
    # process (or a flood) from taking the whole host down
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${HOCHCIV_MEM_LIMIT:-2g}
    labels:
      # Only containers with these labels are updated by the Watchtower below.
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=hochciv-staging
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Required. Use a different value than production.
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env to a long random string}
      # Public URL of staging, e.g. https://staging.hochciv.de
      - BASE_URL=${BASE_URL:-}
      # The server's database role: rows only, no schema changes, no superuser (scripts/db-setup.js)
      - DATABASE_URL=postgres://hochciv_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@hochciv-staging-db:5432/${POSTGRES_DB:-hochciv}
      # Owner of the tables: only for the migrations before the server starts (entrypoint.sh)
      - MIGRATION_DATABASE_URL=postgres://hochciv_owner:${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD in .env}@hochciv-staging-db:5432/${POSTGRES_DB:-hochciv}
      # E-mail – optional. Without SMTP_HOST, mails are only written to the log.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # STARTTLS is required on ports other than 465 (off: SMTP_REQUIRE_TLS=off)
      - SMTP_REQUIRE_TLS=${SMTP_REQUIRE_TLS:-}
      # Without SMTP_HOST mails go to the log with their codes hidden; on = show them (testing only)
      - MAIL_LOG_CODES=${MAIL_LOG_CODES:-}
      # Push notifications – leave empty on staging unless you test push.
      - FCM_SERVICE_ACCOUNT=${FCM_SERVICE_ACCOUNT:-}
      # Monitoring (docs/operations/monitoring.md)
      - GRAFANA_URL=${GRAFANA_URL-http://grafana:3000}
      - METRICS_PORT=9464
      # the dashboards of this release into the monitoring volume (utils/monitoringSync.js)
      - MONITORING_SYNC_DIR=/monitoring
    networks:
      nginx:
      internal:
        aliases:
          - hochciv-app
    volumes:
      - ${MONITORING_CONFIG:-monitoring-config}:/monitoring

  # ── Monitoring (docs/operations/monitoring.md) ──────────────────────────────────────────────
  # Prometheus collects the server's figures (utils/metrics.js) and the database's; Grafana shows
  # them in the admin page (tab "Leistung"), proxied by the server for admins only. None of them
  # is reachable from outside: internal network only, no published ports.
  monitoring-setup:
    # One-shot: copies the Prometheus and Grafana configuration (monitoring/ in the image) into a
    # volume, so the host needs no files besides this one. The server (uid 1000) may write it and
    # copies its own monitoring/ there at every start, so Watchtower updates bring new dashboards
    image: peterswode/hochciv-multiplayer:staging
    container_name: hochciv-staging-monitoring-setup
    restart: "no"
    user: "0"
    entrypoint: ["sh", "-c", "rm -rf /monitoring/* && cp -r /app/monitoring/. /monitoring/ && chown -R 1000:1000 /monitoring && chmod -R a+rX /monitoring && ([ $$(stat -c %u /prometheus-data) = 65534 ] || chown -R 65534:65534 /prometheus-data) && ([ $$(stat -c %u /grafana-data) = 472 ] || chown -R 472:0 /grafana-data)"]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - ${MONITORING_CONFIG:-monitoring-config}:/monitoring
      # gives the data folders to the users of Prometheus (65534) and Grafana (472) – a folder
      # Docker creates for a bind mount belongs to root
      - ${PROMETHEUS_DATA:-prometheus-data}:/prometheus-data
      - ${GRAFANA_DATA:-grafana-data}:/grafana-data

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hochciv-staging-prometheus
    restart: unless-stopped
    depends_on:
      monitoring-setup:
        condition: service_completed_successfully
    command:
      - --config.file=/monitoring/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${MONITORING_CONFIG:-monitoring-config}:/monitoring:ro
      # a named volume, or a folder (PROMETHEUS_DATA=./data/prometheus, owned by uid 65534)
      - ${PROMETHEUS_DATA:-prometheus-data}:/prometheus
    networks:
      - internal

  postgres-exporter:
    # The database's figures, including the slowest queries (pg_stat_statements)
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: hochciv-staging-postgres-exporter
    restart: unless-stopped
    depends_on:
      hochciv-staging-db-setup:
        condition: service_completed_successfully
    command: ["--collector.stat_statements"]
    environment:
      # the app role, which may read the statistics views (pg_monitor, scripts/db-setup.js)
      - DATA_SOURCE_NAME=postgresql://hochciv_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@hochciv-staging-db:5432/${POSTGRES_DB:-hochciv}?sslmode=disable
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.1.0
    container_name: hochciv-staging-grafana
    restart: unless-stopped
    depends_on:
      monitoring-setup:
        condition: service_completed_successfully
    environment:
      # served by the game server under /admin/grafana/ (utils/grafana.js)
      - GF_SERVER_ROOT_URL=${BASE_URL:-http://localhost:3000}/admin/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SECURE=true
      # no login of its own: the game server sets the admin's name and role
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_HEADERS=Role:X-WEBAUTH-ROLE
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      - GF_LIVE_MAX_CONNECTIONS=0
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_PATHS_PROVISIONING=/monitoring/grafana/provisioning
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/monitoring/grafana/dashboards/hochciv.json
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${MONITORING_CONFIG:-monitoring-config}:/monitoring:ro
      # a named volume, or a folder (GRAFANA_DATA=./data/grafana, owned by uid 472)
      - ${GRAFANA_DATA:-grafana-data}:/var/lib/grafana
    networks:
      - internal

  watchtower:
    image: nickfedor/watchtower:1.23.0
    container_name: hochciv-staging-watchtower
    restart: unless-stopped
    environment:
      # Only update containers labelled for this scope – never production.
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCOPE=hochciv-staging
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      - WATCHTOWER_CLEANUP=true
    labels:
      - com.centurylinklabs.watchtower.scope=hochciv-staging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  nginx:
    # The Docker network of the reverse proxy (PROXY_NETWORK in .env, default "proxy").
    external: true
    name: ${PROXY_NETWORK:-proxy}
  internal:

volumes:
  pgdata:
  monitoring-config:
  prometheus-data:
  grafana-data:
