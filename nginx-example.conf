# Hochciv Multiplayer Server – nginx reverse-proxy configuration
# Domain: hoochvciv.peterswo.de
#
# Place this file in /etc/nginx/sites-available/ and symlink to sites-enabled.
# Adjust ssl_certificate paths to your actual cert (e.g. Let's Encrypt).

server {
    listen 80;
    server_name hoochvciv.peterswo.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hoochvciv.peterswo.de;

    ssl_certificate     /etc/letsencrypt/live/hoochvciv.peterswo.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoochvciv.peterswo.de/privkey.pem;

    # ── REST API ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.IO (WebSocket + polling fallback) ─────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Health check ─────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3000;
    }
}
