name: PR Source Check

# main only takes changes that were tested on staging (development),
# plus urgent fixes from hotfix/* branches. See README.md "Branches and release flow".
on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited]

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Only development or hotfix/* may be merged into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error::PRs into main must come from this repository, not from $HEAD_REPO."
            exit 1
          fi
          case "$HEAD_REF" in
            development|hotfix/*)
              echo "OK: $HEAD_REF -> main"
              ;;
            *)
              echo "::error::PRs into main must come from development (or a hotfix/* branch), not from '$HEAD_REF'. Open the PR into development instead."
              exit 1
              ;;
          esac
