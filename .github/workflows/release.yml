name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump version and push tag
        id: tag_version
        if: github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Determine Docker Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IMG_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "IMG_TAG=${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_ENV
          else
            echo "IMG_TAG=dev-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi

      # Login Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Login GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Build & Push
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/hochciv-multiplayer:latest
            ghcr.io/peterswode/hochciv-multiplayer:latest
            ${{ vars.DOCKERHUB_USERNAME }}/hochciv-multiplayer:${{ env.IMG_TAG }}
            ghcr.io/peterswode/hochciv-multiplayer:${{ env.IMG_TAG }}

      # Create GitHub Release (Only on main branch pushes)
      - name: Create a GitHub release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: |
            Automated release for version ${{ steps.tag_version.outputs.new_tag }}.
            Docker Images:
            - Docker Hub: ${{ vars.DOCKERHUB_USERNAME }}/hochciv-multiplayer:${{ steps.tag_version.outputs.new_tag }}
            - GHCR: ghcr.io/peterswode/hochciv-multiplayer:${{ steps.tag_version.outputs.new_tag }}
            
            ${{ steps.tag_version.outputs.changelog }}
