name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
      - development
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bump version and push tag
        id: tag_version
        if: github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Determine Docker Tag
        id: vars
        run: |
          # CHANNEL_TAG: "latest" is production, "staging" is the development branch
          # (pulled by Watchtower on the staging server, see docker-compose.staging.yml).
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IMG_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "CHANNEL_TAG=latest" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "IMG_TAG=${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_ENV
            echo "CHANNEL_TAG=latest" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/development ]]; then
            echo "IMG_TAG=staging-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
            echo "CHANNEL_TAG=staging" >> $GITHUB_ENV
          else
            echo "IMG_TAG=dev-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
            echo "CHANNEL_TAG=dev" >> $GITHUB_ENV
          fi

      # Login Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Login GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push
      - name: Build & Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/hochciv-multiplayer:${{ env.CHANNEL_TAG }}
            ghcr.io/peterswode/hochciv-multiplayer:${{ env.CHANNEL_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/hochciv-multiplayer:${{ env.IMG_TAG }}
            ghcr.io/peterswode/hochciv-multiplayer:${{ env.IMG_TAG }}

      # Create GitHub Release (Only on main branch pushes)
      - name: Create a GitHub release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: |
            Automated release for version ${{ steps.tag_version.outputs.new_tag }}.
            Docker Images:
            - Docker Hub: ${{ vars.DOCKERHUB_USERNAME }}/hochciv-multiplayer:${{ steps.tag_version.outputs.new_tag }}
            - GHCR: ghcr.io/peterswode/hochciv-multiplayer:${{ steps.tag_version.outputs.new_tag }}
            
            ${{ steps.tag_version.outputs.changelog }}
