name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Login GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Build & Push (only amd64)
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/hochciv-multiplayer:latest
            ghcr.io/${{ github.repository_owner }}/hochciv-multiplayer:latest
            ${{ github.ref_type == 'tag' && format('{0}/hochciv-multiplayer:{1}', vars.DOCKERHUB_USERNAME, github.ref_name) || '' }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/hochciv-multiplayer:{1}', github.repository_owner, github.ref_name) || '' }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for version ${{ github.ref_name }}.
            Docker Images:
            - Docker Hub: ${{ vars.DOCKERHUB_USERNAME }}/hochciv-multiplayer:${{ github.ref_name }}
            - GHCR: ghcr.io/${{ github.repository_owner }}/hochciv-multiplayer:${{ github.ref_name }}
