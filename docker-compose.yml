version: '3.8'

services:
  hochciv-db:
    image: postgres:15-alpine
    container_name: hochciv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hochciv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-hochciv}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  hochciv:
    image: peterswode/hochciv-multiplayer:latest
    container_name: hochciv-multiplayer
    restart: unless-stopped
    depends_on:
      - hochciv-db
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-hochciv_prod_secret_h7b82x9q}
      - DATABASE_URL=postgres://${POSTGRES_USER:-hochciv}:${POSTGRES_PASSWORD:-password123}@hochciv-db:5432/${POSTGRES_DB:-hochciv}
      - CORE_REPO_URL=https://github.com/timooom-hash/Hochciv.git
      - CORE_REPO_BRANCH=main
      - UPDATE_INTERVAL_SEC=3600
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    networks:
      - nginx
      - internal

networks:
  nginx:
    external: true
  internal:

volumes:
  pgdata:
