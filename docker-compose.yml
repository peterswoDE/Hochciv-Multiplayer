version: '3.8'

services:
  hochciv:
    image: peterswode/hochciv-multiplayer:latest
    container_name: hochciv-multiplayer
    restart: unless-stopped
    # By default, Docker inherits DNS from the host system.
    # If your specific deployment requires custom DNS servers, uncomment below:
    # dns:
    #   - 8.8.8.8
    #   - 1.1.1.1
    environment:
      - PORT=3000
      # Original repository URL
      - CORE_REPO_URL=https://github.com/timooom-hash/Hochciv.git
      # Branch to pull (defaults to main)
      - CORE_REPO_BRANCH=main
      # Update interval in seconds (default 3600 = 1 hour)
      - UPDATE_INTERVAL_SEC=3600
    volumes:
      - ./mp.js:/app/mp.js
      - ./server.js:/app/server.js
      - ./sessions.js:/app/sessions.js
      - ./sockets:/app/sockets
    networks:
      default:
        priority: 1000
      nginx:
        priority: 100

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
  nginx:
    external: true
