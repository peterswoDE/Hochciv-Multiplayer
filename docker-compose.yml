# Production setup. All settings come from the .env file next to this file
# (copy .env.template to .env and fill it in). See README.md.

services:
  hochciv-db:
    image: postgres:15-alpine
    container_name: hochciv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hochciv}
      # The superuser – only for the database itself, backups and hochciv-db-setup. Only used
      # when the database volume is created for the first time.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hochciv}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # A named volume, or a folder (POSTGRES_DATA=./postgres in .env, for an existing installation)
      - ${POSTGRES_DATA:-pgdata}:/var/lib/postgresql/data
    networks:
      - internal

  hochciv-db-setup:
    # One-shot at every `docker compose up`: creates the database roles the server uses
    # (hochciv_owner for migrations, hochciv_app for everything else) and hands the tables to the
    # owner (scripts/db-setup.js). Runs as the database superuser, whose password the server no
    # longer gets.
    image: peterswode/hochciv-multiplayer:${HOCHCIV_IMAGE_TAG:-latest}
    container_name: hochciv-db-setup
    restart: "no"
    entrypoint: ["node", "scripts/db-setup.js"]
    depends_on:
      hochciv-db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - DB_HOST=hochciv-db
      - POSTGRES_USER=${POSTGRES_USER:-hochciv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-hochciv}
      - POSTGRES_OWNER_PASSWORD=${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD in .env}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    networks:
      - internal

  hochciv:
    # Pin a release with HOCHCIV_IMAGE_TAG (e.g. v1.4.2) instead of "latest"
    image: peterswode/hochciv-multiplayer:${HOCHCIV_IMAGE_TAG:-latest}
    container_name: hochciv-multiplayer
    restart: unless-stopped
    depends_on:
      hochciv-db-setup:
        condition: service_completed_successfully
    # The server needs no Linux capabilities and no privilege changes; limits keep a runaway
    # process (or a flood) from taking the whole host down
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${HOCHCIV_MEM_LIMIT:-2g}
    labels:
      # Updated by the Watchtower below whenever a new image is published (a merge into main)
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=hochciv
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Required. The server refuses to start with a missing or publicly known value.
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env to a long random string}
      # Public URL, scheme + host only (e.g. https://hochciv.example). Used for OAuth
      # callbacks, e-mail links and passkeys. A malformed value stops the server at startup.
      - BASE_URL=${BASE_URL:-}
      # The server's database role: rows only, no schema changes, no superuser (scripts/db-setup.js)
      - DATABASE_URL=postgres://hochciv_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@hochciv-db:5432/${POSTGRES_DB:-hochciv}
      # Owner of the tables: only for the migrations before the server starts (entrypoint.sh)
      - MIGRATION_DATABASE_URL=postgres://hochciv_owner:${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD in .env}@hochciv-db:5432/${POSTGRES_DB:-hochciv}
      # E-mail (activation, password reset, 2FA codes, turn notifications)
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # STARTTLS is required on ports other than 465 (off: SMTP_REQUIRE_TLS=off)
      - SMTP_REQUIRE_TLS=${SMTP_REQUIRE_TLS:-}
      # Without SMTP_HOST mails go to the log with their codes hidden; on = show them (testing only)
      - MAIL_LOG_CODES=${MAIL_LOG_CODES:-}
      # Push notifications of the Android app (Firebase service account key, base64) – optional
      - FCM_SERVICE_ACCOUNT=${FCM_SERVICE_ACCOUNT:-}
    networks:
      - nginx
      - internal

  watchtower:
    image: nickfedor/watchtower:1.23.0
    container_name: hochciv-watchtower
    restart: unless-stopped
    environment:
      # Only containers labelled for this scope: production (above). Staging has its own
      # Watchtower with the scope "hochciv-staging" (docker-compose.staging.yml).
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCOPE=hochciv
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      - WATCHTOWER_CLEANUP=true
    labels:
      - com.centurylinklabs.watchtower.scope=hochciv
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  nginx:
    # The Docker network of the reverse proxy (PROXY_NETWORK in .env, default "proxy").
    external: true
    name: ${PROXY_NETWORK:-proxy}
  internal:

volumes:
  pgdata:
