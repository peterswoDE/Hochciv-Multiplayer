# Production setup. All settings come from the .env file next to this file
# (copy .env.template to .env and fill it in). See README.md.

services:
  hochciv-db:
    image: postgres:15-alpine
    container_name: hochciv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hochciv}
      # Only used when the database volume is created for the first time.
      # Reachable only on the internal network – still: set your own value in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-hochciv}
    volumes:
      # A named volume, or a folder (POSTGRES_DATA=./postgres in .env, for an existing installation)
      - ${POSTGRES_DATA:-pgdata}:/var/lib/postgresql/data
    networks:
      - internal

  hochciv:
    # Pin a release with HOCHCIV_IMAGE_TAG (e.g. v1.4.2) instead of "latest"
    image: peterswode/hochciv-multiplayer:${HOCHCIV_IMAGE_TAG:-latest}
    container_name: hochciv-multiplayer
    restart: unless-stopped
    depends_on:
      - hochciv-db
    labels:
      # Updated by the Watchtower below whenever a new image is published (a merge into main)
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=hochciv
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Required. The server refuses to start with a missing or publicly known value.
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env to a long random string}
      # Public URL, scheme + host only (e.g. https://hochciv.example). Used for OAuth
      # callbacks, e-mail links and passkeys. A malformed value stops the server at startup.
      - BASE_URL=${BASE_URL:-}
      - DATABASE_URL=postgres://${POSTGRES_USER:-hochciv}:${POSTGRES_PASSWORD:-password123}@hochciv-db:5432/${POSTGRES_DB:-hochciv}
      # E-mail (activation, password reset, 2FA codes, turn notifications)
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Push notifications of the Android app (Firebase service account key, base64) – optional
      - FCM_SERVICE_ACCOUNT=${FCM_SERVICE_ACCOUNT:-}
    networks:
      - nginx
      - internal

  watchtower:
    image: nickfedor/watchtower:1.23.0
    container_name: hochciv-watchtower
    restart: unless-stopped
    environment:
      # Only containers labelled for this scope: production (above). Staging has its own
      # Watchtower with the scope "hochciv-staging" (docker-compose.staging.yml).
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCOPE=hochciv
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      - WATCHTOWER_CLEANUP=true
    labels:
      - com.centurylinklabs.watchtower.scope=hochciv
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  nginx:
    # The Docker network of the reverse proxy (PROXY_NETWORK in .env, default "nginx").
    external: true
    name: ${PROXY_NETWORK:-nginx}
  internal:

volumes:
  pgdata:
