version: '3.8'

services:
  hochciv-db:
    image: postgres:15-alpine
    container_name: hochciv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hochciv
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: hochciv
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  hochciv:
    image: peterswode/hochciv-multiplayer:latest
    container_name: hochciv-multiplayer
    restart: unless-stopped
    depends_on:
      - hochciv-db
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://hochciv:password123@hochciv-db:5432/hochciv
      - CORE_REPO_URL=https://github.com/timooom-hash/Hochciv.git
      - CORE_REPO_BRANCH=main
      - UPDATE_INTERVAL_SEC=3600
    networks:
      - nginx
      - internal

networks:
  nginx:
    external: true
  internal:

volumes:
  pgdata:
